
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | RedStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="container">
    <div class="nav">
        <a class="logo" href="index.html">RedStore.</a>
        <nav><ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a class="active" href="account.html">Account</a></li>
        </ul></nav>
    </div>
</header>

<main>
    <section class="page-heading">
        <h1>My Account</h1>
        <p>Welcome back to RedStore.</p>
    </section>

    <section class="container section">
        <form class="form-box" action="#" method="get">
            <h2>Login</h2>

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   placeholder="Enter your password" required>

            <button class="btn" type="submit">Login</button>

            <p class="form-note">
                New customer?
                <a href="#register" style="color:#ff523b">Create an account</a>
            </p>
        </form>

        <div style="height:30px"></div>

        <form id="register" class="form-box" action="#" method="get">
            <h2>Create Account</h2>

            <label for="fullname">Full Name</label>
            <input id="fullname" name="fullname" type="text"
                   placeholder="Enter your name" required>

            <label for="newemail">Email Address</label>
            <input id="newemail" name="newemail" type="email"
                   placeholder="Enter your email" required>

            <label for="newpassword">Create Password</label>
            <input id="newpassword" name="newpassword" type="password"
                   minlength="6" placeholder="Create a password" required>

            <button class="btn" type="submit">Register</button>

            <p class="form-note">
                Demo only: Login and registration are not connected to a database.
            </p>
        </form>
    </section>
</main>

<footer class="footer">
    <p>RedStore — Style Meets Comfort</p>
    <p>© 2026 RedStore. Demo website.</p>
</footer>
</body>
</html>
