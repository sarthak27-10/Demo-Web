
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RedStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="container">
    <div class="nav">
        <a class="logo" href="index.html">RedStore.</a>
        <nav><ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a class="active" href="contact.html">Contact</a></li>
            <li><a href="account.html">Account</a></li>
        </ul></nav>
    </div>
</header>

<main>
    <section class="page-heading">
        <h1>Contact Us</h1>
        <p>Have a question? Send us a message.</p>
    </section>

    <section class="container section">
        <form class="form-box" action="#" method="get">
            <h2>Get In Touch</h2>

            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" placeholder="Enter subject" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message" required></textarea>

            <button class="btn" type="submit">Submit Message</button>
            <p class="form-note">Demo form: messages are not emailed or stored.</p>
        </form>
    </section>
</main>

<footer class="footer">
    <p>RedStore — Style Meets Comfort</p>
    <p>© 2026 RedStore. Demo website.</p>
</footer>
</body>
</html>
